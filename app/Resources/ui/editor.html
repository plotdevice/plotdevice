<!DOCTYPE html>
<html lang="en">
<head>
    <style type="text/css" media="screen">
        #editor { 
            line-height: 1.4em;
            font-family:"Menlo";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
        }
        
        /* draw the native scrollbars in dark themes' colors, at the output pane's small size */
        #editor.ace_dark { color-scheme: dark; }
        * { scrollbar-width: thin; }

        /* italicize kwarg names */
        .ace_variable.ace_parameter { font-style: italic; }

        /* allow the max tooltip width to be a little bigger than default */
        #editor .ace_tooltip {
            max-width: min(48em, 66vw);
        }
        
        /* the "read mode…" link in tooltips */
        .ace_symbol-doc-more {
            margin-top: 4px;
            cursor: pointer;
            font-family: system-ui;
            font-style: italic;
        }

        .ace_symbol-doc-more::before{
          content:"";
          display:block;
          border-top: 1px solid currentColor;
          opacity: 0.6;
        }
        .ace_symbol-doc-more span{ 
          opacity: .6; 
          padding: 4px 0 2px 0;
          display:inline-block;
        }
        .ace_symbol-doc-more:hover span {
            text-decoration: underline;
            opacity:1;
        }


    </style>
    <script src="js/ace/ace.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/ace/ext-language_tools.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/ace/ext-static_highlight.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/keybindings.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/symbols.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/editor.js" type="text/javascript" charset="utf-8"></script>
    <link rel="stylesheet" type="text/css" href="autocomplete.css">
</head>
<body>
<div id="editor"></div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // initialize ace
        window.editor = Editor("#editor")
        console.log('ED', editor)

        // intercept opt-tab before the webview uses it for ill
        function option_tab(e){
            if (e.altKey && e.which==9){
                editor.exec('startAutocomplete')
                e.stopPropagation()
                e.preventDefault()
            }
        }

        document.querySelector('body').addEventListener('keydown', option_tab, true)
    })
</script>

    
</body>
</html>
