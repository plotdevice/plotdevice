<!DOCTYPE html>
<html lang="en">
<head>
    <style type="text/css" media="screen">
        #editor { 
            line-height: 1.4em;
            font-family:"Menlo";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
        }
        
        div.ace_scrollbar{
            -webkit-transition:opacity, 0.333s;
            opacity:0!important;
        }
        #editor.scrolling-v div.ace_scrollbar-v{
            opacity:1!important;
        }
        #editor.scrolling-h div.ace_scrollbar-h{
            opacity:1!important;
        }
        div.ace_scrollbar-v{ right:2px!important; bottom:3px!important; top:3px!important;}
        div.ace_scrollbar-h{ right:4px!important; bottom:3px!important;}
        div.ace_scrollbar-v::-webkit-scrollbar {width: 0.48em;}
        div.ace_scrollbar-h::-webkit-scrollbar {height: 0.48em;}
        div.ace_scrollbar::-webkit-scrollbar-thumb {
            color:transparent;
            background: rgba(80, 80, 80, 0.6); 
            border-radius:.48em;
            box-shadow: inset 0 0 6px rgba(80, 80, 80, 0.3);
        }
        #editor.ace_dark div.ace_scrollbar-v{ right:3px!important; bottom:3px!important; top:3px!important;}
        #editor.ace_dark div.ace_scrollbar-h{ right:4px!important; bottom:3px!important;}
        #editor.ace_dark div.ace_scrollbar-v::-webkit-scrollbar {width: 0.3em;}
        #editor.ace_dark div.ace_scrollbar-h::-webkit-scrollbar {height: 0.3em;}
        #editor.ace_dark div.ace_scrollbar::-webkit-scrollbar-thumb {
            color:transparent;
            background: rgba(255, 255, 255, 0.5);
            border-radius:.2em;
            box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.3);
        }

        .ace_symbol-doc-link {
            /* ace's "text" markers are empty overlay divs, not text nodes, so
               text-decoration has nothing to draw under -- border-bottom works
               since these divs are already sized to the token's line height.
               position:absolute is required -- ace's built-in marker classes
               (ace_selection, ace_bracket, etc.) each declare this themselves
               in the stylesheet; the top/left set inline by the renderer are
               otherwise ignored and the div renders in normal static flow.
               z-index must beat the other .ace_marker-layer classes (active-line:2,
               step/stack:3, selected-word:4, selection:5, bracket:6) or this gets
               painted underneath them since it otherwise stacks in DOM order */
            position: absolute;
            z-index: 7;
            border-bottom: 1px solid currentColor;
            cursor: pointer;
        }

    </style>
    <script src="js/ace/ace.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/ace/ext-language_tools.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/ace/ext-linking.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/keybindings.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/symbols.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/editor.js" type="text/javascript" charset="utf-8"></script>
    <link rel="stylesheet" type="text/css" href="autocomplete.css">
</head>
<body>
<div id="editor"></div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // initialize ace
        window.editor = Editor("#editor")
        console.log('ED', editor)

        // intercept opt-tab before the webview uses it for ill
        function option_tab(e){
            if (e.altKey && e.which==9){
                editor.exec('startAutocomplete')
                e.stopPropagation()
                e.preventDefault()
            }
        }

        document.querySelector('body').addEventListener('keydown', option_tab, true)
    })
</script>

    
</body>
</html>
